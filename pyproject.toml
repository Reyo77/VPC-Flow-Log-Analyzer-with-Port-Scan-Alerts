[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
"flowlog_analyzer/dashboard.py" = ["E501"]  # long HTML/CSS template lines

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
